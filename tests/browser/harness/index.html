<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Datepicker field harness</title>
    <style>
      /* Nova's colour variables, which field.css reads. */
      :root {
        --colors-white: 255, 255, 255;
        --colors-gray-100: 243, 244, 246;
        --colors-gray-200: 229, 231, 235;
        --colors-gray-300: 209, 213, 219;
        --colors-gray-400: 156, 163, 175;
        --colors-gray-600: 75, 85, 99;
        --colors-gray-700: 55, 65, 81;
        --colors-primary-500: 14, 165, 233;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
      }

      main {
        padding: 0 24px;
      }

      .spacer {
        height: 1600px;
      }

      .component {
        width: 320px;
      }

      .component input {
        box-sizing: border-box;
        width: 100%;
        height: 36px;
        padding: 0 8px;
      }

      output {
        display: block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
